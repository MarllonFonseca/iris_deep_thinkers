<style>
body{margin:0}
a{color:#7FB7CF}a:hover{color:#A9D3E4}
button:disabled{cursor:default}
.tema-escuro{--bg:#0D0C0A;--glow1:rgba(207,227,243,0.13);--glow2:rgba(95,157,184,0.14);--card:rgba(255,255,255,0.06);--card2:rgba(255,255,255,0.025);--card-shadow:none;--line:rgba(255,255,255,0.12);--line2:rgba(255,255,255,0.08);--tx:#F2F4F7;--tx2:#C5CBD3;--tx3:#8E959E;--tx-soft:#E1E5EA;--chip:rgba(255,255,255,0.06);--acc:#CFE3F3;--acc-tx:#0D0C0A;--acc-text:#CFE3F3;--acc-dot:#CFE3F3;--acc-glow:rgba(207,227,243,0.35);--acc-soft:rgba(207,227,243,0.14);--acc-line:rgba(207,227,243,0.5);--cta:#F2F4F7;--cta-tx:#0D0C0A;--cta-glow:rgba(242,244,247,0.14);--nav:rgba(22,24,28,0.82);--nav-shadow:0 16px 40px rgba(0,0,0,0.45);--ok:#7FD1A6;--ok-tx:#7FD1A6;--ok-soft:rgba(127,209,166,0.14);--ok-glow:rgba(127,209,166,0.22);--ok-line:rgba(127,209,166,0.40);--ylw:#EBD35B;--ylw-tx:#EBD35B;--ylw-soft:rgba(235,211,91,0.13);--ylw-line:rgba(235,211,91,0.42);--ylw-glow:rgba(235,211,91,0.22);--warn:#F0A940;--warn-tx:#F0A940;--warn-soft:rgba(240,169,64,0.15);--warn-glow:rgba(240,169,64,0.24);--warn-line:rgba(240,169,64,0.45);--bad:#F0766B;--bad-tx:#F0766B;--bad-soft:rgba(240,118,107,0.15);--bad-glow:rgba(240,118,107,0.26);--bad-line:rgba(240,118,107,0.45);--grid-line:rgba(242,244,247,0.38);--grid-cell:#100F0D;--grid-mark:rgba(207,227,243,0.55);--overlay:rgba(5,5,6,0.66);--sheet:#15171B;--sheet-line:rgba(255,255,255,0.10);--grid-old:rgba(255,255,255,0.22)}
.tema-claro{--bg:#FAFBFC;--glow1:rgba(207,227,243,0.85);--glow2:rgba(95,157,184,0.12);--card:rgba(255,255,255,0.96);--card2:rgba(244,248,252,0.94);--card-shadow:0 10px 30px rgba(13,12,10,0.06);--line:rgba(13,12,10,0.13);--line2:rgba(13,12,10,0.07);--tx:#0D0C0A;--tx2:#45484D;--tx3:#5F636A;--tx-soft:#1F2124;--chip:rgba(13,12,10,0.04);--acc:#CFE3F3;--acc-tx:#0D0C0A;--acc-text:#2F5E80;--acc-dot:#5B8DB3;--acc-glow:rgba(120,170,210,0.35);--acc-soft:rgba(207,227,243,0.65);--acc-line:#9DC2DE;--cta:#0D0C0A;--cta-tx:#FFFFFF;--cta-glow:rgba(13,12,10,0.18);--nav:rgba(255,255,255,0.9);--nav-shadow:0 14px 34px rgba(13,12,10,0.12);--ok:#3FAE6A;--ok-tx:#1E7B34;--ok-soft:rgba(63,174,106,0.13);--ok-glow:rgba(127,209,166,0.35);--ok-line:rgba(30,123,52,0.30);--ylw:#E2C232;--ylw-tx:#7A6500;--ylw-soft:rgba(226,194,50,0.18);--ylw-line:rgba(122,101,0,0.32);--ylw-glow:rgba(226,194,50,0.30);--warn:#F0A940;--warn-tx:#A05A00;--warn-soft:rgba(240,169,64,0.18);--warn-glow:rgba(240,169,64,0.30);--warn-line:rgba(160,90,0,0.32);--bad:#E0645A;--bad-tx:#C4141B;--bad-soft:rgba(224,100,90,0.13);--bad-glow:rgba(240,118,107,0.25);--bad-line:rgba(196,20,27,0.30);--grid-line:rgba(13,12,10,0.55);--grid-cell:#FFFFFF;--grid-mark:rgba(120,170,210,0.55);--overlay:rgba(13,12,10,0.32);--sheet:#FFFFFF;--sheet-line:rgba(13,12,10,0.08);--grid-old:rgba(13,12,10,0.14)}
@keyframes dt-pisca { 0%,100% { border-color: rgba(242,211,107,1); box-shadow: 0 0 0 0 rgba(242,211,107,0); } 50% { border-color: rgba(242,211,107,0.25); box-shadow: 0 0 0 5px rgba(242,211,107,0.5); } }
</style>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#050506}
#palco{width:1194px;height:834px;flex:none;transform-origin:center center;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.45)}
</style>
<!-- Backend (offline): dados simulados, regras, motor, modelo, armazenamento e ligação aos ecrãs -->
<script src="../dados.js?v=20261115h"></script>
<script src="../../motor/regras.js?v=20261115h"></script>
<script src="../../motor/motor.js?v=20261115h"></script>
<script src="../../motor/modelo.js?v=20261115h"></script>
<script src="../armazenamento.js?v=20261115h"></script>
<script src="../camara/vendor/mediapipe/face_detection.js?v=20261115h"></script>
<script src="../camara/distancia.js?v=20261115h"></script>
<script src="ligacao.js?v=20261115h"></script>
<script src="voz.js?v=20261115h"></script>
<script src="i18n.js?v=20261115h"></script>
<script src="runtime.js?v=20261115h"></script>
</head>
<body>
<div id="palco"><div id="raiz"></div></div>
<template id="dc-modelo">
<div class="{{ temaClasse }}" style="position: relative; width: 1194px; height: 834px; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: var(--tx); -webkit-font-smoothing: antialiased; background: radial-gradient(45% 55% at 22% 60%, var(--glow1), rgba(0,0,0,0) 70%), radial-gradient(40% 45% at 95% 0%, var(--glow2), rgba(0,0,0,0) 70%), var(--bg)">

<div style="position: absolute; left: 40px; right: 40px; top: 28px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<span class="dt-logo" role="img" aria-label="IRIS" title="Integrated Remote Intelligence for Spaceflight" style="width: 65px; height: 36px; color: var(--tx)"></span>
<span style="margin-left: 6px; font-size: 12px; font-weight: 700; color: var(--tx3); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px">{{ selo }}</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{ toggleTema }}" aria-pressed="{{ claro }}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--chip); color: var(--tx); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">
<sc-if value="{{ escuro }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{ claro }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if>
{{ temaLabel }}</button>
<a href="Perfil.html" style="display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 14px 0 4px; border-radius: 20px; background: var(--chip); border: 1px solid var(--line2); font-size: 13px; font-weight: 600; color: var(--tx); text-decoration: none">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: linear-gradient(135deg, #E6F1FA, #9DC2DE); color: #0D0C0A; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ eu.ini }}</span>{{ eu.nome }}<span style="font-weight: 500; color: var(--tx3)">· Day {{ eu.dia }}</span></a>
</div>
</div>

<header style="position: absolute; left: 40px; right: 40px; top: 84px; display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; color: var(--tx2)">{{ subtitulo }}</span>
<h1 style="margin: 0; font-size: 32px; font-weight: 400; letter-spacing: -0.6px; color: var(--tx)">{{ passoTitulo }}</h1>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<nav aria-label="Check type" style="display: flex; gap: 4px; padding: 4px; border-radius: 24px; background: var(--chip); border: 1px solid var(--line2)">
<span aria-current="page" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14px; font-weight: 700; color: var(--acc-tx); background: var(--acc)">Quick tests</span>
<a href="OCT.html" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14px; font-weight: 700; color: var(--tx2); text-decoration: none">OCT</a>
<a href="Tendencia.html" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14px; font-weight: 700; color: var(--tx2); text-decoration: none">History</a>
</nav>
<button type="button" onClick="{{ abrirAjuda }}" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px 0 8px; border-radius: 22px; border: 1px solid var(--acc-line); background: var(--acc-soft); color: var(--tx); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 15px; background: var(--acc); color: var(--acc-tx); font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">?</span>Help</button>
</div>
</header>

<nav aria-label="Check progress" style="position: absolute; left: 40px; top: 152px; width: 1114px; height: 62px">
<span aria-hidden="true" style="position: absolute; left: 139px; top: 15px; width: 836px; height: 2px; border-radius: 1px; background: var(--line)"></span>
<span aria-hidden="true" style="position: absolute; left: 139px; top: 15px; width: {{ progressoPx }}px; height: 2px; border-radius: 1px; background: var(--acc); box-shadow: 0 0 10px var(--acc-glow)"></span>
<div style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<sc-for list="{{ nos }}" as="n" hint-placeholder-count="4">
<button type="button" onClick="{{ n.ir }}" disabled="{{ n.bloqueado }}" aria-current="{{ n.atualAria }}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; font-family: inherit; cursor: {{ n.cursor }}">
<span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; border: 2px solid {{ n.borda }}; background: {{ n.fundo }}; color: {{ n.cor }}; box-shadow: {{ n.glow }}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ n.feito }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M6 12.5l4 4 8-9"></path></svg></sc-if>
<sc-if value="{{ n.numero }}" hint-placeholder-val="{{ true }}">{{ n.num }}</sc-if>
</span>
<span style="font-size: 13px; font-weight: {{ n.peso }}; color: {{ n.corLabel }}; text-align: center">{{ n.label }}</span>
</button>
</sc-for>
</div>
</nav>

<sc-if value="{{ p1 }}" hint-placeholder-val="{{ true }}">
<section aria-labelledby="ola-titulo" style="position: absolute; left: 40px; top: 228px; width: 300px; height: 432px; box-sizing: border-box; padding: 20px 20px; border-radius: 26px; background: radial-gradient(100% 60% at 0% 0%, {{ pr.glow }}, rgba(0,0,0,0) 60%), linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid {{ pr.linha }}; box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 8px; overflow-y: auto">
<h2 id="ola-titulo" style="margin: 0; font-size: 24px; font-weight: 400; letter-spacing: -0.4px; color: var(--tx)">{{ ola }}</h2>
<sc-if value="{{ pr.pronto }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.3px; color: var(--tx3)">READINESS FOR THE TEST</span>
<span role="status" style="display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 400; color: {{ pr.cor }}"><span aria-hidden="true" style="width: 11px; height: 11px; flex: none; border-radius: 6px; background: {{ pr.dot }}; box-shadow: 0 0 14px {{ pr.dot }}"></span>{{ pr.titulo }}</span>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--tx-soft)">{{ pr.texto }}</p>
<sc-for list="{{ pr.ressalvas }}" as="r" hint-placeholder-count="2">
<div style="display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; line-height: 1.4; color: var(--tx)"><span aria-hidden="true" style="width: 6px; height: 6px; flex: none; border-radius: 3px; background: {{ pr.dot }}; transform: translateY(-2px)"></span>{{ r }}</div>
</sc-for>
<sc-if value="{{ pr.alerta }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--bad-soft); border: 1px solid var(--bad-line); font-size: 13.5px; line-height: 1.4; font-weight: 600; color: var(--bad-tx)">{{ pr.textoAlerta }}</div>
</sc-if>
<sc-if value="{{ pr.vermelho }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ responderDeNovo }}" style="height: 40px; margin-top: 4px; border: 1px solid var(--line); border-radius: 20px; background: var(--chip); color: var(--tx); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Answer again</button>
</sc-if>
</sc-if>
<sc-if value="{{ pr.dicas }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0 0 2px; font-size: 14px; line-height: 1.45; color: var(--tx2)">{{ pr.dicasTxt }}</p>
<sc-for list="{{ preparar }}" as="k" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid var(--line2)">
<span aria-hidden="true" style="width: 34px; height: 34px; flex: none; border-radius: 17px; background: var(--acc-soft); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: var(--acc-text); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="{{ k.icone }}"></path></svg></span>
<span style="font-size: 13.5px; line-height: 1.4; color: var(--tx-soft)">{{ k.t }}</span>
</div>
</sc-for>
</sc-if>
</section>

<section aria-labelledby="perg-titulo" style="position: absolute; left: 356px; top: 228px; width: 798px; height: 432px; box-sizing: border-box; padding: 16px 22px 14px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; min-height: 42px">
<div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
<h2 id="perg-titulo" style="margin: 0; font-size: 17px; font-weight: 600; color: var(--tx)">Pre-exam questionnaire</h2>
<span style="font-size: 13px; color: var(--tx3)">{{ qPagTxt }} · answer for how you feel right now</span>
</div>
<div aria-hidden="true" style="display: flex; gap: 6px">
<sc-for list="{{ qPontos }}" as="d" hint-placeholder-count="3">
<span style="width: {{ d.w }}px; height: 8px; border-radius: 4px; background: {{ d.cor }}"></span>
</sc-for>
</div>
<button type="button" onClick="{{ tudoNormal }}" style="height: 34px; padding: 0 14px; border: 1px solid var(--ok-line); border-radius: 17px; background: var(--ok-soft); color: var(--ok-tx); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">All normal</button>
</div>
<sc-for list="{{ qPag }}" as="q" hint-placeholder-count="3">
<div role="group" aria-label="{{ q.t }}" style="display: flex; flex-direction: column; gap: 6px; padding: 8px 0 6px; border-top: 1px solid var(--line2)">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 12px; font-weight: 700; color: var(--acc-text)">{{ q.n }}</span><span style="font-size: 14.5px; font-weight: 600; line-height: 1.3; color: var(--tx)">{{ q.t }}</span><span style="font-size: 12px; color: var(--tx3)">{{ q.sub }}</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ q.ops }}" as="op" hint-placeholder-count="3">
<button type="button" onClick="{{ op.pick }}" aria-pressed="{{ op.on }}" style="min-height: 36px; padding: 5px 10px; border-radius: 12px; border: 1px solid {{ op.borda }}; background: {{ op.fundo }}; color: {{ op.cor }}; font-family: inherit; font-size: 12.5px; font-weight: 600; line-height: 1.25; text-align: left; cursor: pointer">{{ op.t }}</button>
</sc-for>
</div>
</div>
</sc-for>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<sc-if value="{{ qTemAnterior }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ qAnterior }}" style="height: 36px; padding: 0 16px; border: 1px solid var(--line); border-radius: 18px; background: transparent; color: var(--tx); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer">‹ Previous questions</button>
</sc-if>
<span style="flex-grow: 1"></span>
<sc-if value="{{ qTemSeguinte }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ qSeguinte }}" aria-disabled="{{ qSeguinteOff }}" style="height: 36px; padding: 0 18px; border: 0; border-radius: 18px; background: {{ qSeguinteFundo }}; color: {{ qSeguinteCor }}; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer">Next questions ›</button>
</sc-if>
</div>
</section>
</sc-if>

<sc-if value="{{ p2Intro }}" hint-placeholder-val="{{ false }}">
<section aria-labelledby="ac-intro" style="position: absolute; left: 40px; top: 228px; width: 1114px; height: 432px; box-sizing: border-box; padding: 24px 28px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; gap: 32px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.6px; color: var(--acc-text)">BEFORE THE TEST · INSTRUCTIONS</span>
<h2 id="ac-intro" style="margin: 0; font-size: 28px; font-weight: 400; letter-spacing: -0.4px; color: var(--tx)">Near acuity test</h2>
<p style="margin: 0 0 6px; font-size: 15px; color: var(--tx2)">Let's see how small a letter you can read. About 1 minute per eye.</p>
<sc-for list="{{ acPassos }}" as="p" hint-placeholder-count="5">
<div style="display: flex; gap: 12px; align-items: flex-start"><span aria-hidden="true" style="width: 26px; height: 26px; flex: none; border-radius: 13px; background: var(--acc-soft); color: var(--acc-text); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ p.n }}</span><span style="font-size: 15.5px; line-height: 1.45; color: var(--tx); padding-top: 2px">{{ p.t }}</span></div>
</sc-for>
</div>
<div style="width: 340px; flex: none; display: flex; flex-direction: column; gap: 12px">
<div style="padding: 14px 16px; border-radius: 16px; background: var(--acc-soft); font-size: 14px; line-height: 1.45; color: var(--tx)">If your reading is worse than last time, the app asks you to read again with the <b>spare glasses</b>. Try first without effort, as you do every day.</div>
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.6px; color: var(--tx3); margin-top: 4px">VOICE</span>
<div style="display: flex; gap: 6px"><button type="button" onClick="{{ vz.alternarVoz }}" aria-pressed="{{ vz.voz.on }}" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{ vz.voz.borda }}; background: {{ vz.voz.fundo }}; color: {{ vz.voz.cor }}; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg>{{ vz.voz.t }}</button><button type="button" onClick="{{ vz.alternarMic }}" aria-pressed="{{ vz.mic.on }}" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{ vz.mic.borda }}; background: {{ vz.mic.fundo }}; color: {{ vz.mic.cor }}; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>{{ vz.mic.t }}</button></div>
<sc-if value="{{ vz.temMsg }}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 12.5px; line-height: 1.4; color: var(--tx3)">{{ vz.msg }}</span></sc-if>
<div style="flex-grow: 1"></div>

// Linhas de letras: sorteadas de novo em cada teste, para cada olho e para a leitura com óculos de reserva

function baralhar(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  'A line of letters appears. For each letter, left to right, tap the same letter on the keypad, or say it out loud with the microphone on.',

  'Tap the squares where you saw something different. If you saw nothing, tap All looks straight, or say “all straight”.',
  'Then cover your right eye and repeat.'
];
class Component extends DCLogic {
  constructor(props) {

  acInicial() {

      acertos: { esq: { sem: [0, 0], com: [0, 0] }, dir: { sem: [0, 0], com: [0, 0] } } };

  amInicial() {
    return { eye: 'dir', marks: { dir: {}, esq: {} }, feito: { dir: false, esq: false }, direito: { dir: false, esq: false } };
  }
  componentDidMount() {
    const upd = {};

      const p = window.localStorage.getItem('visao-perfil');

      if (p === 'A' || p === 'B' || p === 'C') upd.perfil = p;
      const r = window.localStorage.getItem('visao-evento-' + (upd.perfil || this.state.perfil));
      if (r === 'sim' || r === 'nao' || r === 'naosei') upd.resp = r;

    if (window.Visao && window.Visao.real()) { upd.real = window.Visao.real(); upd.resp = null; }
    this.setState(upd);
    this.ouvir = (ev) => {
      if (!ev) return;

  falar(t, semInterromper, clips) { if (window.Voz) { if (clips && window.Voz.falarClip) window.Voz.falarClip(clips, t, semInterromper); else window.Voz.falar(t, semInterromper); } }
  aoOuvir(texto) {

  // O mesmo que os botões, mas por voz: letras, «seguinte», «apagar», «não consigo», «tudo direito», «repetir».
  comando(c) {

  lerIntro(n) {

  }
  comecar(n) {

  }
  // Diz o que fazer a seguir no teste de acuidade.
  falarAc() {
    const a = this.state.ac;
    const olho = a.eye === 'esq' ? 'left' : 'right', outro = a.eye === 'esq' ? 'right' : 'left';

      this.falar(pre + 'Line ' + (a.linha + 1) + '. ' + (this.linhas()[a.linha].length === 1 ? 'Which letter do you see?' : 'Which letters do you see, from left to right?'), false,

    } else if (a.fase === 'fim') {
      const r = a.res[a.eye][a.pass];
      this.falar((olho === 'left' ? 'Left' : 'Right') + ' eye: ' + (r === 0 ? 'you read no lines' : 'you read up to line ' + r) + '. ' +
        (this.piorAgora() ? 'Reading is worse than your baseline. Put on the spare glasses and read again.' : (a.eye === 'esq' ? 'Say “next” to go to the right eye.' : 'Say “next” to finish.')), false,
        ['end_' + olho + '_' + (r || 0), this.piorAgora() ? 'then_spare' : (a.eye === 'esq' ? 'then_right_eye' : 'then_finish')]);

    const a = this.state.ac, ant = this._ant;

  }
  testeAtivo() {
    const s = this.state;
    return (s.passo === 2 && !s.intro[2] && s.ac.fase === 'ler') || (s.passo === 3 && !s.intro[3]);
  }
  // ---------- Acuidade: respostas e acertos ----------
  responder(L) {
    let completa = false, certas = 0, n = 0;
    this.setAc((a) => {
      if (a.fase !== 'ler') return a;
      const linha = this.linhas()[a.linha];
      if (a.resp.length >= linha.length) return a;
      const resp = a.resp.concat([L]);
      completa = resp.length === linha.length;
      n = linha.length; certas = resp.filter((x, i) => x === linha[i]).length;
      return Object.assign(a, { resp: resp });
    });
    if (completa) this.falar(certas + ' correct out of ' + n + '. Say “next” to continue.', false, ['score_' + certas + '_of_' + n]);
  }
  apagar() { this.setAc((a) => (a.fase === 'ler' && a.resp.length ? Object.assign(a, { resp: a.resp.slice(0, -1) }) : a)); }
  somarAcertos(a, certas, total) {
    const ac = { esq: Object.assign({}, a.acertos.esq), dir: Object.assign({}, a.acertos.dir) };
    const v = ac[a.eye][a.pass];
    ac[a.eye][a.pass] = [v[0] + certas, v[1] + total];
    return Object.assign(a, { acertos: ac });
  }
  lidaOuFim(a, lida) {
    if (lida) {
      if (a.linha === this.linhas().length - 1) return this.terminarOlho(a, this.linhas().length);
      return Object.assign(a, { linha: a.linha + 1, toques: {}, resp: [] });
    }
    return this.terminarOlho(a, a.linha);

  // Linha lida se acertou pelo menos 60% das letras (1 de 1, 2 de 2, 2 de 3, 3 de 4, 3 de 5).
  avancarLinha() {
    const a0 = this.state.ac, linha = this.linhas()[a0.linha];
    if (a0.fase !== 'ler' || a0.resp.length < linha.length) return;
    const certas = a0.resp.filter((x, i) => x === linha[i]).length;
    this.setAc((a) => this.lidaOuFim(this.somarAcertos(a, certas, linha.length), certas >= Math.ceil(linha.length * 0.6)));

  }
  naoConsigo() {
    const a0 = this.state.ac, linha = this.linhas()[a0.linha];
    if (a0.fase !== 'ler') return;
    const certas = a0.resp.filter((x, i) => x === linha[i]).length;
    this.setAc((a) => this.lidaOuFim(this.somarAcertos(a, certas, linha.length), false));
    this.falarAc();
  }
  // ---------- Grelha de Amsler ----------
  proximoOlhoAm(a) { if (!a.feito.dir) return 'dir'; if (!a.feito.esq) return 'esq'; return a.eye; }

    const am = this.state.am;
    if (am.feito.dir && am.feito.esq) this.falar('Grid done. Say “next” to see the result.', false, ['amsler_done']);
    else this.falar('Now cover your ' + (am.eye === 'dir' ? 'left' : 'right') + ' eye and look at the dot in the centre.', false, [am.eye === 'dir' ? 'amsler_cover_left' : 'amsler_cover_right']);
  }
  amTudoDireito() {
    this.setAm((a) => { a.marks[a.eye] = {}; a.direito[a.eye] = true; a.feito[a.eye] = true; a.eye = this.proximoOlhoAm(a); return a; });
    this.depoisOlhoAm();
  }
  amConcluir() {
    if (Object.keys(this.state.am.marks[this.state.am.eye]).length === 0) return;
    this.setAm((a) => { a.feito[a.eye] = true; a.direito[a.eye] = false; a.eye = this.proximoOlhoAm(a); return a; });
    this.depoisOlhoAm();
  }
  irPara(n) {
    this.setState((st) => ({ passo: n, max: Math.max(st.max, n), ajuda: false, relatorio: false }));
    this.ligarCamara(n);
    if ((n === 2 || n === 3) && this.state.intro[n]) this.lerIntro(n);
    if (n === 4) {
      this.guardarNoBackend(); if (window.Voz) window.Voz.desligarMicrofone();
      setTimeout(() => {
        const nv = this._nivel || 0, R = ['green', 'yellow', 'orange', 'red'];
        const T = ['Result: green. All within your baseline. Keep the normal schedule.', 'Result: yellow. Conditions may have affected the test. Repeat when you can.',
          'Result: orange. There is a change since your baseline. The medical team will review it.', 'Result: red. Clinical priority. Tell the flight surgeon now.'];
        if (this.state.passo === 4) this.falar(T[nv], false, ['result_' + R[nv]]);
      }, 350);
    }
  }
  // Câmara: só mede a distância (40 cm na acuidade, 33 cm na grelha de Amsler). Nada é gravado.
  ligarCamara(n) {
    if (!window.Visao) return;
    const cam = window.Visao.camara;
    if (n === 2 || n === 3) {
      const alvo = n === 2 ? [35, 45] : [28, 38];

        const cm = r.cm;

            else if (r.estado === 'longe') { this.falar('Move a little closer to the screen.', true, ['dist_closer']); this._falaDist = agora; }
            else if (r.estado === 'ok' && (d.estado === 'perto' || d.estado === 'longe')) { this.falar('Distance OK.', true, ['dist_ok']); this._falaDist = agora; }
          }

      });

      cam.parar();
    }
  }
  // Devolve {estado, cm} só quando vale a pena redesenhar; null para ignorar este fotograma.
  // - margem de 2 cm à volta do intervalo (não salta entre "ok" e "perto" na fronteira);
  // - um novo estado tem de durar 0,8 s (1,5 s para "sem cara") antes de aparecer;

  estabilizarDist(bruto, alvo) {
    const agora = Date.now();
    const e = this._estab || (this._estab = { estado: null, cm: null, cand: null, desde: 0, tCm: 0 });

      concluirOlho: () => this.amConcluir(),
      concluirOff: nMarcas(am.eye) === 0,
      concluirOp: nMarcas(am.eye) === 0 ? 0.45 : 1,
      // 4
      hero: hero,
      relatorio: s.relatorio && s.passo === 4, relFrase: relFrase, relTestes: relTestes, relMissao: relMissao, relPorque: porque, relMeta: relMeta, relAccoes: accoes,
      abrirRelatorio: () => this.setState({ relatorio: true }), fecharRelatorio: () => this.setState({ relatorio: false }),
      aconteceu: aconteceu,
      mapas: mapas,
      condRes: condRes,
      accoes: accoes,
      revisao: REV[nivel],
      comAlerta: nivel >= 2,
      refazer: () => { if (window.Visao) { window.Visao.camara.parar(); window.Visao.camara.limpar(); } this.setState({ passo: 1, max: 1, qv: {}, qpag: 0, ac: this.acInicial(), am: this.amInicial(), back: null, dist: null, intro: { 2: true, 3: true }, resp: this.state.real ? null : this.state.resp }); },
      noInicio: s.passo === 1,
      opAnterior: s.passo === 1 ? 0.4 : 1,
      anterior: () => { if (this.state.passo > 1) this.irPara(this.state.passo - 1); },
      temSeguinte: s.passo < 4,
      seguinteOff: seguinteOff,
      opSeguinte: seguinteOff ? 0.45 : 1,
      seguinteLabel: s.passo < 4 ? seguintes[s.passo - 1] : '',
      seguinte: () => {
        if (seguinteOff) return;
        if (this.state.passo < 4) this.irPara(this.state.passo + 1);
      }
    };
  }
}
window.Component = Component;
</script>
