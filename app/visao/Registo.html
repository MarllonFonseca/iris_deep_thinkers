<sc-if value="{{ escuro }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>

<section aria-labelledby="reg-missao" style="position: absolute; top: 172px; height: 470px; box-sizing: border-box; padding: 20px 22px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; left: 40px; width: 352px">

<span style="font-size: 13px; font-weight: 700; color: var(--tx2)">Destination</span>

<section aria-labelledby="reg-olhos" style="position: absolute; top: 172px; height: 470px; box-sizing: border-box; padding: 20px 22px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; left: 408px; width: 352px">
<h2 id="reg-olhos" style="margin: 0; font-size: 18px; font-weight: 600; color: var(--tx)">Your eyes</h2>

</sc-for>
</div>
</div>

<div role="group" aria-label="Spare glasses on board" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: var(--tx2)">Spare glasses on board</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{ reservas }}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="min-height: 40px; padding: 6px 14px; border-radius: 14px; border: 1px solid {{ o.borda }}; background: {{ o.fundo }}; color: {{ o.cor }}; font-family: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.25; text-align: left; cursor: pointer">{{ o.t }}</button>
</sc-for>
</div>
</div>

<div role="group" aria-label="Known eye condition" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: var(--tx2)">Known eye condition</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{ condicoes }}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="min-height: 40px; padding: 6px 14px; border-radius: 14px; border: 1px solid {{ o.borda }}; background: {{ o.fundo }}; color: {{ o.cor }}; font-family: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.25; text-align: left; cursor: pointer">{{ o.t }}</button>
</sc-for>
</div>
</div>

</section>

<section aria-labelledby="reg-oct" style="position: absolute; top: 172px; height: 470px; box-sizing: border-box; padding: 20px 22px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; left: 776px; width: 378px">
<h2 id="reg-oct" style="margin: 0; font-size: 18px; font-weight: 600; color: var(--tx)">Baseline OCT <span style="font-size: 13px; font-weight: 500; color: var(--tx3)">· optional</span></h2>
<p style="margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--tx2)">Retinal thickness around the optic nerve, from the ground clinic exam. If you do not have it, skip it.</p>
<div style="display: flex; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1">
<label for="oct-oe" style="font-size: 13px; font-weight: 700; color: var(--tx2)">Left eye (µm)</label>
<input id="oct-oe" type="number" inputmode="numeric" placeholder="E.g. 360" value="{{ octOE }}" onChange="{{ onOctOE }}" style="height: 44px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 15px; color: var(--tx); background: var(--chip); width: 100%">
</div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1">
<label for="oct-od" style="font-size: 13px; font-weight: 700; color: var(--tx2)">Right eye (µm)</label>
<input id="oct-od" type="number" inputmode="numeric" placeholder="E.g. 360" value="{{ octOD }}" onChange="{{ onOctOD }}" style="height: 44px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 15px; color: var(--tx); background: var(--chip); width: 100%">
</div>
</div>
<span style="font-size: 12.5px; color: {{ octMsgCor }}">{{ octMsg }}</span>
<div style="display: flex; flex-direction: column; gap: 2px; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--line2)">
<span style="font-size: 13px; font-weight: 700; color: var(--tx2)">What happens next</span>
<sc-for list="{{ passos }}" as="k" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 6px 0"><span aria-hidden="true" style="width: 22px; height: 22px; flex: none; border-radius: 11px; background: var(--acc-soft); color: var(--acc-text); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ k.n }}</span><span style="font-size: 13.5px; line-height: 1.4; color: var(--tx-soft)">{{ k.t }}</span></div>
</sc-for>
</div>
</section>

<div style="position: absolute; left: 40px; right: 40px; top: 658px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a href="Main.html" style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px; border: 1px solid var(--line); border-radius: 25px; color: var(--tx); font-size: 15px; font-weight: 600; text-decoration: none">‹ Sign in</a>
<span role="status" style="font-size: 14px; color: {{ estadoCor }}">{{ estado }}</span>
<button type="button" onClick="{{ guardar }}" aria-disabled="{{ bloqueado }}" style="height: 50px; padding: 0 26px; border: 0; border-radius: 25px; background: {{ btnFundo }}; color: {{ btnCor }}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Save and record my baseline ›</button>
</div>

<div aria-hidden="true" style="position: absolute; left: -1500px; right: -1500px; top: 712px; bottom: -1500px; pointer-events: none; background: linear-gradient(180deg, transparent 0, var(--bg) 90px)"></div>
<nav aria-label="App sections" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 36px; background: var(--nav); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line2); box-shadow: var(--nav-shadow)">
<a href="Hoje.html" aria-label="Today" style="width: 56px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: var(--tx2); text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></a>
<a href="TesteRapido.html" aria-label="Checks" style="width: 56px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: var(--tx2); text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 9.3h16M4 14.6h16M9.3 4v16M14.6 4v16"></path></svg></a>
<a href="SANS.html" aria-label="SANS monitoring" style="width: 56px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: var(--tx2); text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></a>
<a href="Alerta.html" aria-label="Alerts" style="width: 56px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: var(--tx2); text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></a>
</nav>

</div>
</template>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const r = (window.Visao && window.Visao.registoDe()) || {};
    this.state = { tema: 'escuro', destino: r.destino || null, lancamento: r.lancamento || '', duracao: r.duracao ? String(r.duracao) : '',
      correcao: r.correcao || null, reserva: r.reserva || null, condicao: r.condicao || null,
      octOE: r.oct_oe ? String(r.oct_oe) : '', octOD: r.oct_od ? String(r.oct_od) : '', feito: !!r.data };
  }
  componentDidMount() {
    try { const t = window.localStorage.getItem('visao-tema'); if (t === 'claro' || t === 'escuro') this.setState({ tema: t }); } catch (e) {}
    // Sem sessão de um perfil real: volta à entrada.
    if (!(window.Visao && window.Visao.real())) { try { window.location.href = 'Main.html'; } catch (e) {} }
  }
  renderVals() {
    const s = this.state;
    const eu = window.Visao && window.Visao.real() ? window.Visao.eu() : { nome: '—', dia: 0 };
    const chips = (chave, ops) => ops.map((o) => {
      const on = s[chave] === o[0];
      return { t: o[1], on: on, fundo: on ? 'var(--acc-soft)' : 'transparent', borda: on ? 'var(--acc-line)' : 'var(--line)', cor: on ? 'var(--acc-text)' : 'var(--tx2)',
        pick: () => { const u = {}; u[chave] = o[0]; this.setState(u); } };
    });
    const valido = (v) => v === '' || (!isNaN(Number(v)) && Number(v) >= 200 && Number(v) <= 800);
    const octOk = valido(s.octOE) && valido(s.octOD) && ((s.octOE === '') === (s.octOD === ''));
    const falta = [];
    if (!s.destino) falta.push('destination');
    if (!s.correcao) falta.push('vision correction');
    if (!s.reserva) falta.push('spare glasses');
    if (!s.condicao) falta.push('known eye condition');
    const pode = !falta.length && octOk;
    let estado = s.feito ? 'Registration saved on ' + 'this device. You can update it.' : 'Recorded once, on Earth, before launch. Stored only on this device.';
    let estadoCor = 'var(--tx3)';
    if (falta.length) { estado = 'Still to answer: ' + falta.join(', ') + '.'; }
    else if (!octOk) { estado = 'Check the OCT values (200–800 µm, both eyes).'; estadoCor = 'var(--bad-tx)'; }
    const claro = s.tema === 'claro';
    return {
      temaClasse: claro ? 'tema-claro' : 'tema-escuro',
      selo: window.Visao ? window.Visao.selo() : 'Real data',
      claro: claro, escuro: !claro, temaLabel: claro ? 'Dark mode' : 'Light mode',
      toggleTema: () => { const nt = this.state.tema === 'escuro' ? 'claro' : 'escuro'; this.setState({ tema: nt }); try { window.localStorage.setItem('visao-tema', nt); } catch (e) {} },
      sub: 'On Earth, before launch · done once · stored only on this device',
      chip: eu.nome + ' · Pre-flight',
      destinos: chips('destino', [['lua', 'Moon · Artemis'], ['iss', 'Space station (ISS)'], ['marte', 'Mars transit'], ['outra', 'Other']]),
      lancamento: s.lancamento, onLancamento: (e) => this.setState({ lancamento: e.target.value }),
      duracao: s.duracao, onDuracao: (e) => this.setState({ duracao: e.target.value }),
      correcoes: chips('correcao', [['nenhuma', 'None'], ['leitura', 'Reading glasses'], ['sempre', 'Glasses all the time'], ['lentes', 'Contact lenses']]),
      reservas: chips('reserva', [['sim', 'Yes'], ['nao', 'No']]),
      condicoes: chips('condicao', [['nao', 'None'], ['sim', 'Yes, the medical team knows']]),
      octOE: s.octOE, octOD: s.octOD,
      onOctOE: (e) => this.setState({ octOE: e.target.value }), onOctOD: (e) => this.setState({ octOD: e.target.value }),
      octMsg: octOk ? (s.octOE ? 'Values accepted. They become your OCT baseline.' : 'Optional.') : 'Unlikely value or only one eye. Check it.',
      octMsgCor: octOk ? (s.octOE ? 'var(--ok-tx)' : 'var(--tx3)') : 'var(--bad-tx)',
      passos: ['Save this registration.', 'Do the quick tests now: they become your pre-flight baseline.', 'In flight, every test is compared with this baseline.'].map((t, i) => ({ n: i + 1, t: t })),
      estado: estado, estadoCor: estadoCor,
      bloqueado: !pode, btnFundo: pode ? 'var(--cta)' : 'var(--chip)', btnCor: pode ? 'var(--cta-tx)' : 'var(--tx3)',
      guardar: () => {
        if (!pode || !window.Visao) return;
        window.Visao.guardarRegisto({ destino: s.destino, lancamento: s.lancamento, duracao: s.duracao ? Number(s.duracao) : null,
          correcao: s.correcao, reserva: s.reserva, condicao: s.condicao,
          oct_oe: s.octOE ? Math.round(Number(s.octOE)) : null, oct_od: s.octOD ? Math.round(Number(s.octOD)) : null });
        window.location.href = 'TesteRapido.html';
      }
    };
  }
}
window.Component = Component;
</script>
</body>
</html>
