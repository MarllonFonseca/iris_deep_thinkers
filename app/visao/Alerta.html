</div>
<sc-if value="{{ d.comPacote }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; color: var(--tx3)">{{ pacoteTxt }}</span>
<sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ send }}" style="height: 50px; border: 0; border-radius: 25px; background: var(--bad-btn); color: var(--bad-btn-tx); font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 28px var(--bad-btn-glow)">Send to the flight surgeon</button>
</sc-if>
<sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">

<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 15px; font-weight: 700; color: var(--tx)">Queued for sending</span><span style="font-size: 13px; color: var(--tx2)">Sends as soon as there is contact with Earth.</span></span>

</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 8px">

<a href="Hoje.html" aria-label="Today" style="width: 56px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: var(--tx2); text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></a>
<a href="TesteRapido.html" aria-label="Checks" style="width: 56px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: var(--tx2); text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 9.3h16M4 14.6h16M9.3 4v16M14.6 4v16"></path></svg></a>
<a href="SANS.html" aria-label="SANS monitoring" style="width: 56px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: var(--tx2); text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></a>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tema: 'escuro', perfil: 'C', resp: null, filtro: 'todos', sel: null, sent: false, vistos: {} };
  }
  dono(perfil) { return window.Visao && window.Visao.real() ? window.Visao.real() : 'demo-' + perfil; }
  marcar(ids, valor) {
    this.setState((st) => {
      const v = Object.assign({}, st.vistos);
      ids.forEach((id) => { if (valor) v[id] = true; else delete v[id]; });
      if (window.Visao) window.Visao.guardarVistos(this.dono(st.perfil), v);
      return { vistos: v };
    });
  }
  componentDidMount() {
    const upd = {};
    try {
      const t = window.localStorage.getItem('visao-tema');
      const p = window.localStorage.getItem('visao-perfil');
      if (t === 'claro' || t === 'escuro') upd.tema = t;
      if (p === 'A' || p === 'B' || p === 'C') upd.perfil = p;
      const r = window.localStorage.getItem('visao-evento-' + (upd.perfil || this.state.perfil));
      if (r === 'sim' || r === 'nao' || r === 'naosei') upd.resp = r;
    } catch (e) {}
    // alertas vistos: guardados por perfil (real ou de demonstração)
    upd.vistos = window.Visao ? window.Visao.vistosDe(this.dono(upd.perfil || this.state.perfil)) : {};
    this.setState(upd);
    this.ouvir = (ev) => {
      if (ev && ev.key === 'visao-tema' && (ev.newValue === 'claro' || ev.newValue === 'escuro')) this.setState({ tema: ev.newValue });
    };
    try { window.addEventListener('storage', this.ouvir); } catch (e) {}
  }
  componentWillUnmount() {
    try { window.removeEventListener('storage', this.ouvir); } catch (e) {}
  }
  renderVals() {
    const s = this.state;
    const eus = { A: { nome: 'Marta Silveira', ini: 'MS', dia: 60 }, B: { nome: 'Daniel Cossa', ini: 'DC', dia: 90 }, C: { nome: 'Sofia Lindqvist', ini: 'SL', dia: 84 } };
    const euReal = window.Visao ? window.Visao.eu() : null;
    const eu = euReal || eus[s.perfil] || eus.B;
    const NIV = [
      { nome: 'Green · routine', curto: 'Green', cor: 'var(--ok-tx)', dot: 'var(--ok)', soft: 'var(--ok-soft)', glow: 'var(--ok-glow)', linha: 'var(--ok-line)' },
      { nome: 'Yellow · possible interference', curto: 'Yellow', cor: 'var(--ylw-tx)', dot: 'var(--ylw)', soft: 'var(--ylw-soft)', glow: 'var(--ylw-glow)', linha: 'var(--ylw-line)' },
      { nome: 'Orange · clinical review advised', curto: 'Orange', cor: 'var(--warn-tx)', dot: 'var(--warn)', soft: 'var(--warn-soft)', glow: 'var(--warn-glow)', linha: 'var(--warn-line)' },
      { nome: 'Red · clinical priority', curto: 'Red', cor: 'var(--bad-tx)', dot: 'var(--bad)', soft: 'var(--bad-soft)', glow: 'var(--bad-glow)', linha: 'var(--bad-line)' }
    ];
    const L = {
      sans: { t: 'See in SANS monitoring', href: 'SANS.html' },
      teste: { t: 'Repeat the test', href: 'TesteRapido.html' },
      evento: { t: 'See event in profile', href: 'Perfil.html', evento: true },
      oct: { t: 'See OCT history', href: 'OCT.html', oct: true },
      hist: { t: 'See history', href: 'Tendencia.html' }
    };
    // [id, nivel, titulo, quandoCurto, o que, quando, fontes, fiabilidade, acção, revisão, links, pacote]
    const D = {
      A: [
        ['a1', 0, 'Routine tests within your baseline', 'Day 60', 'Acuity 5/5 in both eyes and Amsler grid unchanged. OCT on day 60 +6.9% vs baseline, within the simulated reference.', 'Day 60 · 08:05 UTC', 'Quick test on screen · external on-board OCT · pre-flight baseline', 'Good conditions (reliability 92/100). Good-quality OCT image.', 'Keep the normal schedule. Next OCT on day 90.', 'Not needed', ['sans', 'hist'], false],
        ['a2', 1, 'Amsler grid with limited conditions', 'Day 58', 'The Amsler grid was done in low light and was flagged as “limited conditions”.', 'Day 58 · 21:40 UTC', 'Automatic check of test conditions', 'Result with reduced reliability.', 'Repeated on day 60 in good light: no changes.', 'Resolved on day 60', ['teste'], false]
      ],
      B: [
        ['b1', 2, 'Retina above your pre-flight baseline', 'Day 90', 'Left-eye OCT: peripapillary retinal thickness +17.0% vs baseline (362 → 424 µm). Signs of mild oedema to be confirmed.', 'Day 90 · 09:15 UTC', 'External on-board OCT (simulated) · pre-flight baseline', 'Good-quality image. No interference recorded.', 'Review by the medical team. Bring the next OCT forward to day 100, if the doctor agrees.', 'Pending', ['oct', 'sans'], false],
        ['b2', 2, 'Acuity change between consecutive checks', 'Day 90', 'Left eye dropped from 5/5 (day 87) to 4/5 (day 90). Right eye unchanged.', 'Day 90 · 10:42 UTC', 'Quick test on screen · astronaut answers', 'Limited conditions: motion during the test (10:42–10:43 UTC). The motion does not rule out the change.', 'Repeat in stable conditions. The change goes to medical review.', 'Pending', ['teste', 'sans'], false],
        ['b3', 2, 'New zones on the Amsler grid (LE)', 'Day 87', 'Two mild zones marked in the left eye, off-centre. The previous test had no zones.', 'Day 87 · 08:10 UTC', 'Quick test on screen', 'Good conditions (reliability 91/100).', 'Review by the medical team. Repeat the grid at the next test.', 'Pending', ['sans'], false],
        ['b4', 1, 'Spacecraft motion during acuity', 'Day 90', 'The station recorded unusual motion during your acuity test.', 'Day 90 · 10:42–10:43 UTC (52 s)', 'Automatic log from the app and station', 'The acuity test was flagged as “limited conditions”.', 'Answer the event notification in your profile and repeat the acuity test.', 'EVENTO', ['evento', 'teste'], false],
        ['b5', 0, 'RE Amsler grid unchanged', 'Day 87', 'No zones marked in the right eye.', 'Day 87 · 08:10 UTC', 'Quick test on screen', 'Good conditions (reliability 91/100).', 'Keep the normal schedule for this eye.', 'Not needed', ['hist'], false]
      ],
      C: [
        ['c1', 3, 'New zone at the centre of the Amsler grid (LE)', 'Day 84', 'New zone at the centre of the grid, left eye. Same-day OCT: retina +52.9% vs baseline.', 'Day 84 · 07:50 UTC', 'Quick test · external on-board OCT (simulated) · answers', 'Good conditions (90/100). Good-quality OCT image.', 'Tell the flight surgeon now and follow the approved holding plan.', 'Priority', [], true],
        ['c2', 2, 'Possible globe flattening (LE)', 'Day 84', 'Ocular ultrasound with possible posterior flattening in the left eye. Not present on day 60.', 'Day 84 · 08:30 UTC', 'On-board ultrasound (simulated)', 'Acceptable quality. A new exam is recommended to confirm.', 'Review by the medical team.', 'Pending', ['sans'], false],
        ['c3', 2, 'LE acuity dropped 2 lines', 'Day 84', 'Left eye from 5/5 to 3/5 in three weeks. Right eye from 5/5 to 4/5.', 'Day 63 to day 84', 'Quick tests on screen', 'Good conditions in the last three tests.', 'Review by the medical team. Use the spare reading glasses if you need them.', 'Pending', ['teste', 'hist'], false]
      ]
    };
    const respTxt = { sim: 'Answered: you felt the motion', nao: 'Answered: you did not feel it', naosei: 'Answered: not sure' };
    const revEvento = s.resp ? respTxt[s.resp] : 'Your answer is missing';
    const todos = ((euReal && window.Visao.alertas()) || D[s.perfil] || D.B).map((r) => ({ id: r[0], nivel: r[1], titulo: r[2], quandoCurto: r[3], que: r[4], quando: r[5], fontes: r[6], fiab: r[7], accao: s.resp && r[9] === 'EVENTO' ? 'Repeat the acuity test in stable conditions.' : r[8], revisao: r[9] === 'EVENTO' ? revEvento : r[9], links: r[10], pacote: r[11] }));
    const filtroNivel = { todos: -1, vermelho: 3, laranja: 2, amarelo: 1, verde: 0 };
    const fn = filtroNivel[s.filtro];
    const vis = todos.filter((a) => fn === -1 || a.nivel === fn);
    let selA = vis.find((a) => a.id === s.sel) || vis[0] || todos[0];
    const lista = vis.map((a) => {
      const on = a.id === selA.id;
      const nv = NIV[a.nivel];
      return {
        titulo: a.titulo, quandoCurto: a.quandoCurto, nivelCurto: nv.curto, cor: nv.cor, dot: nv.dot,
        revisao: 'Review: ' + a.revisao, vistoTxt: s.vistos[a.id] ? ' · seen' : '', op: s.vistos[a.id] && !on ? 0.6 : 1,
        on: on,
        fundo: on ? 'linear-gradient(180deg, var(--card), var(--card2))' : 'var(--card3)',
        borda: on ? nv.linha : 'var(--line2)',
        pick: () => this.setState({ sel: a.id })
      };
    });
    const filtros = [['todos', 'All', -1], ['vermelho', 'Red', 3], ['laranja', 'Orange', 2], ['amarelo', 'Yellow', 1], ['verde', 'Green', 0]].map((f) => {
      const n = f[2] === -1 ? todos.length : todos.filter((a) => a.nivel === f[2]).length;
      const on = s.filtro === f[0];
      return {
        t: f[1], n: n, on: on,
        bg: on ? 'var(--acc)' : 'transparent', fg: on ? 'var(--acc-tx)' : 'var(--tx2)',
        op: n === 0 && !on ? 0.45 : 1,
        dot: f[2] === -1 ? 'transparent' : NIV[f[2]].dot, dotShow: f[2] === -1 ? 'none' : 'inline-block',
        pick: () => this.setState({ filtro: f[0], sel: null })
      };
    });
    const nv = NIV[selA.nivel];
    const visto = !!s.vistos[selA.id];
    const d = {
      titulo: selA.titulo, nivelNome: nv.nome, cor: nv.cor, dot: nv.dot, soft: nv.soft, glow: nv.glow, linha: nv.linha,
      campos: [
        { k: 'WHAT HAPPENED', v: selA.que },
        { k: 'WHEN', v: selA.quando },
        { k: 'DATA SOURCES', v: selA.fontes },
        { k: 'TECHNICAL RELIABILITY', v: selA.fiab },
        { k: 'RECOMMENDED ACTION', v: selA.accao },
        { k: 'REVIEW STATUS', v: selA.revisao }
      ],
      links: selA.links.map((k) => Object.assign({ go: () => { try { if (L[k].evento) window.localStorage.setItem('visao-abrir', 'eventos'); if (L[k].oct) window.localStorage.setItem('visao-oct-modo', 'comparar'); } catch (e) {} } }, L[k])),
      comPacote: selA.pacote,
      pacoteTxt: euReal ? 'Package ready: your quick tests, Amsler maps and answers (stored on this device).' : 'Package ready: trend, OCT for days 10–84, OCT image, Amsler map and answers',
      visto: visto,
      naoVisto: !visto,
      marcarVisto: () => this.marcar([selA.id], true)
    };
    const naoVistos = todos.filter((a) => !s.vistos[a.id]);
    const claro = s.tema === 'claro';
    return {
      haNaoVistos: naoVistos.length > 0,
      marcarTodos: () => this.marcar(naoVistos.map((a) => a.id), true),
      temaClasse: claro ? 'tema-claro' : 'tema-escuro',
      selo: window.Visao ? window.Visao.selo() : 'Simulated data',
      claro: claro, escuro: !claro,
      temaLabel: claro ? 'Dark mode' : 'Light mode',
      toggleTema: () => {
        const n = this.state.tema === 'escuro' ? 'claro' : 'escuro';
        this.setState({ tema: n });
        try { window.localStorage.setItem('visao-tema', n); } catch (e) {}
      },
      eu: eu,
      filtros: filtros,
      lista: lista,
      d: d,
      sent: s.sent, notSent: !s.sent,
      send: () => this.setState({ sent: true }),
      undo: () => this.setState({ sent: false })
    };
  }
}
window.Component = Component;
</script>
